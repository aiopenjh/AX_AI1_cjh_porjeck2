[project]
name = "supabase-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aiopenjh", email = "Aiopenjh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
